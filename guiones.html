<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guiones LOGI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* Paleta LogiGho (tomada de la página de carga) */
  :root {
    color-scheme: dark;
    --azul: #1e40af;
    --azul-claro: #6c63ff;
    --navy: #0E2C46;
    --naranja: #F26A2E;
    --naranja-claro: #F5A623;
    --rojo: #E52535;
    --verde: #34d399;
    --fondo: #0a111e;
    --ink: #f1f5f9;
    --muted: #94a3b8;
    --line: rgba(255,255,255,.10);
    --soft: rgba(255,255,255,.05);
    --chrome: rgb(24, 34, 54);           /* pestaña activa + barra */
    --cloud: rgba(14, 24, 42, .66);      /* nube de contenido */
    --ecom: #9b95ff; --ecom-bg: rgba(108,99,255,.18);
    --imp: #ff9d66;  --imp-bg: rgba(242,106,46,.18);
    --gancho: var(--naranja);
    --historia: #8b9cff;
    --moraleja: var(--verde);
    --cta: var(--naranja-claro);
    --font-main: 'Roboto', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: 'Outfit', 'Roboto', sans-serif;
  }

  /* Tonos del fondo: cambian con cada pestaña (animables) */
  @property --g1 { syntax: '<color>'; inherits: true; initial-value: rgba(242,106,46,.15); }
  @property --g2 { syntax: '<color>'; inherits: true; initial-value: rgba(30,64,175,.25); }
  @property --g1x { syntax: '<percentage>'; inherits: true; initial-value: 15%; }
  @property --g1y { syntax: '<percentage>'; inherits: true; initial-value: 20%; }
  @property --g2x { syntax: '<percentage>'; inherits: true; initial-value: 85%; }
  @property --g2y { syntax: '<percentage>'; inherits: true; initial-value: 80%; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font: 16px/1.55 var(--font-main);
    background-color: var(--fondo);

  nav.tabs button .num {
    width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;

  /* Pestaña activa: se une a la barra, con las curvas de Chrome abajo */
  nav.tabs button[aria-selected="true"] {
    animation: none; transform: none;
    background: var(--chrome); color: #fff; z-index: 2;
    height: 42px; padding-right: 22px;
    backdrop-filter: none;
  }
  nav.tabs button[aria-selected="true"]::before,
  nav.tabs button[aria-selected="true"]::after {
    content: ""; position: absolute; bottom: 0; width: 10px; height: 10px; pointer-events: none;
  }
  nav.tabs button[aria-selected="true"]::before { left: -10px; background: radial-gradient(circle at 0 0, transparent 9.5px, var(--chrome) 10px); }
  nav.tabs button[aria-selected="true"]::after  { right: -10px; background: radial-gradient(circle at 100% 0, transparent 9.5px, var(--chrome) 10px); }

  @keyframes flotar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }

  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;

  .bar span { color: var(--muted); font-size: 13px; }

  main { position: relative; z-index: 2; max-width: 1120px; margin: 0 auto; padding: 26px 16px 96px; }

  .slide.active {
    display: block;

    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);

  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }

  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  @media (max-width: 760px) {

  @media print {

const pilarClass = p => p === "Importación" ? "imp" : "ecom";
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const words = s => s.trim().split(/\s+/).length;

const tabs = document.getElementById("tabs");
const main = document.getElementById("main");
const slides = [];

function chip(label, value, cls) {
  const c = el("span", "chip" + (cls ? " " + cls : ""));
  c.append(el("b", null, label), document.createTextNode(value));
  return c;
}

GUIONES.forEach((g, i) => {
  const s = el("section", "slide");
  const head = el("div", "head");
  head.append(el("div", "eyebrow", "Guion " + (i + 1) + " de " + GUIONES.length));
  head.append(el("h2", null, g.titulo));
  const total = g.beats.reduce((n, b) => n + words(b.voz), 0);
  const chips = el("div", "chips");
  chips.append(
    chip("Pilar", g.pilar, pilarClass(g.pilar)),
    chip("Temática", g.tematica),
    chip("Objetivo", g.objetivo),
    chip("Duración", "≈ " + Math.round(total / 2.6) + " s · " + total + " palabras"),
    chip("Formato", "1 toma en oficina + edición")
  );
  head.append(chips);
  s.append(head);
  if (g.flag) s.append(el("p", "flag", g.flag));

  const beats = el("div", "card beats");
  g.beats.forEach(b => {
    const row = el("div", "beat " + b.tipo.toLowerCase());
    const lab = el("div", "label");
    lab.append(el("span", "tag", b.tipo), el("span", "time", b.t));
    const body = el("div");
    body.append(el("p", "voz", b.voz));
    const ed = el("div", "edit");
    ed.append(el("strong", null, "En edición"));
    const ul = el("ul");
    b.edit.forEach(x => ul.append(el("li", null, x)));
    ed.append(ul);
    body.append(ed);
    row.append(lab, body);
    beats.append(row);
  });
  s.append(beats);

  const grid = el("div", "grid2");
  const prompter = el("div", "card panel prompter");
  const h = el("h3");
  h.append(document.createTextNode("Texto completo para el presentador"));
  const btn = el("button", "copy", "Copiar");
  const fullText = g.beats.map(b => b.voz).join("\n");
  btn.onclick = () => {
    navigator.clipboard.writeText(fullText).then(() => { btn.textContent = "Copiado"; setTimeout(() => btn.textContent = "Copiar", 1500); }).catch(() => {});
  };
  h.append(btn);
  prompter.append(h);
  g.beats.forEach(b => prompter.append(el("p", null, b.voz)));

  const side = el("div", "stack");
  const alt = el("div", "card panel");
  alt.append(el("h3", null, "Ganchos alternativos"));
  const ol = el("ol"); g.alternativas.forEach(a => ol.append(el("li", null, a))); alt.append(ol);
  const notas = el("div", "card panel");
  notas.append(el("h3", null, "Notas"));
  const ul2 = el("ul"); g.notas.forEach(a => ul2.append(el("li", null, a))); notas.append(ul2);
  side.append(alt, notas);
  grid.append(prompter, side);
  s.append(grid);

  const det = el("details", "card orig");
  det.append(el("summary", null, "Ver la idea original"));
  det.append(el("div", "body", g.original));
  s.append(det);

  slides.push({ s, label: g.titulo, cls: pilarClass(g.pilar), num: String(i + 1) });
});

const CORTOS = ["Cambió el alcance", "3 pasos para China", "Tu vida va peor", "Tu propio jefe", "Primer pedido a China", "Sin local", "Producción"];
slides.forEach((sl, i) => {

  b.setAttribute("role", "tab");
  b.style.setProperty("--float-delay", (-i * 0.45) + "s");

  if (i > 0) { prev.append(el("span", "hint", "← Anterior"), document.createTextNode(slides[i - 1].label)); prev.onclick = () => show(i - 1); } else prev.disabled = true;
  if (i < slides.length - 1) { next.append(el("span", "hint", "Siguiente →"), document.createTextNode(slides[i + 1].label)); next.onclick = () => show(i + 1); next.style.textAlign = "right"; } else next.disabled = true;

// Tono del fondo por pestaña: [color 1, color 2, x1, y1, x2, y2]
const TONOS = [
  ["rgba(242,106,46,.16)", "rgba(30,64,175,.28)", 15, 20, 85, 80],
  ["rgba(245,166,35,.18)", "rgba(16,25,89,.40)", 80, 15, 20, 85],
  ["rgba(108,99,255,.20)", "rgba(242,106,46,.14)", 20, 75, 80, 20],
  ["rgba(229,37,53,.14)", "rgba(30,64,175,.30)", 50, 10, 50, 95],
  ["rgba(242,106,46,.22)", "rgba(108,99,255,.18)", 85, 70, 10, 25],
  ["rgba(16,185,129,.12)", "rgba(30,64,175,.30)", 25, 30, 75, 90],
  ["rgba(245,166,35,.16)", "rgba(229,37,53,.14)", 70, 40, 25, 75]
];
const glow = document.getElementById("glow");
function tono(i) {
  const [c1, c2, x1, y1, x2, y2] = TONOS[i % TONOS.length];
  const st = glow.style;
  st.setProperty("--g1", c1); st.setProperty("--g2", c2);
  st.setProperty("--g1x", x1 + "%"); st.setProperty("--g1y", y1 + "%");
  st.setProperty("--g2x", x2 + "%"); st.setProperty("--g2y", y2 + "%");
}

let current = 0;
function show(i) {
  current = Math.max(0, Math.min(slides.length - 1, i));
  tono(current);
  slides.forEach((sl, j) => {
    sl.s.classList.toggle("active", j === current);
    sl.tab.setAttribute("aria-selected", j === current ? "true" : "false");
  });
  slides[current].tab.scrollIntoView({ block: "nearest", inline: "nearest" });
  history.replaceState(null, "", "#" + (current + 1));
  window.scrollTo(0, 0);
}
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") show(current + 1);
  if (e.key === "ArrowLeft") show(current - 1);
});
show((parseInt(location.hash.slice(1), 10) || 1) - 1);

// Partículas de fondo (mismo efecto de la página de carga LOGI)
(() => {
  const cv = document.getElementById("particles");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; };
  addEventListener("resize", fit); fit();
  const P = Array.from({ length: 38 }, () => nueva({}));
  function nueva(p) {
    p.x = Math.random() * cv.width; p.y = Math.random() * cv.height;
    p.r = Math.random() * 2.2 + 0.8;
    p.vx = (Math.random() - .5) * .45; p.vy = (Math.random() - .5) * .45;
    p.c = Math.random() > .45 ? "rgba(242,106,46," : "rgba(30,64,175,";
    p.o = Math.random() * .5 + .15;
    return p;
  }
  function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      if (!reduce) { p.x += p.vx; p.y += p.vy; }
      if (p.x < 0 || p.x > cv.width || p.y < 0 || p.y > cv.height) nueva(p);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.c + p.o + ")"; ctx.fill();
      for (let j = i + 1; j < P.length; j++) {
        const d = Math.hypot(p.x - P[j].x, p.y - P[j].y);
        if (d < 110) {
          ctx.beginPath(); ctx.strokeStyle = "rgba(242,106,46," + (0.08 * (1 - d / 110)) + ")";
          ctx.lineWidth = .6; ctx.moveTo(p.x, p.y); ctx.lineTo(P[j].x, P[j].y); ctx.stroke();
        }
      }
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
})();
</script>
